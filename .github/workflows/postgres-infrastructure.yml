name: PostgreSQL Infrastructure

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: Verify local PostgreSQL infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Create local Secret
        run: |
          cp infra/local/podman/postgres/secrets/secret.example.yml \
            infra/local/podman/postgres/secrets/secret.yml

      - name: Check Podman network
        run: podman network ls

      - name: Create Podman network if missing
        run: podman network exists nodexa-net || podman network create nodexa-net

      - name: Start PostgreSQL with the project command
        run: bun run podman-kube:up

      - name: Verify PostgreSQL health and connection
        run: |
          container="$(podman ps --filter pod=nodexa-dev \
            --filter name=postgres --format '{{.Names}}' | head -n 1)"
          if [ -z "$container" ]; then
            podman pod ps
            podman ps -a --pod
            exit 1
          fi
          for attempt in {1..30}; do
            if podman exec "$container" \
              pg_isready -U svc_nodexa -d nodexa; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              podman logs "$container"
              exit 1
            fi
            sleep 2
          done
          podman exec "$container" \
            sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql \
              -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1"'

      - name: Tear down PostgreSQL
        if: always()
        run: |
          if bun run podman-kube:down-force; then
            exit 0
          fi

          echo "::warning::Podman forced teardown returned a non-zero status; verifying resources."
          if podman pod exists nodexa-dev ||
            podman secret exists nodexa-postgres-secret ||
            podman volume exists nodexa-postgres-storage; then
            podman pod ps
            podman ps -a --pod
            podman secret ls
            podman volume ls
            exit 1
          fi

          echo "::warning::Podman reported a teardown anomaly, but no Nodexa resources remain."
