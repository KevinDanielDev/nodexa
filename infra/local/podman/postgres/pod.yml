apiVersion: v1
kind: Pod

metadata:
  name: nodexa-dev

spec:
  containers:
    - name: postgres
      image: docker.io/library/postgres:18.6
      ports:
        - containerPort: 5432
          hostPort: 5432

      envFrom:
        - configMapRef:
            name: nodexa-postgres-config
        - secretRef:
            name: nodexa-postgres-secret

      volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql

      startupProbe:
        exec:
          command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 30

      livenessProbe:
        exec:
          command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3

  volumes:
    - name: postgres-storage
      persistentVolumeClaim:
        claimName: nodexa-postgres-storage

---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: nodexa-postgres-storage

spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
